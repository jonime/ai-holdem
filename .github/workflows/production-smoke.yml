name: Production release smoke

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Vercel-triggered Production release smoke run ID (within seven days)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-smoke-ai-holdem
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.sender.login == 'vercel[bot]' &&
       github.event.sender.type == 'Bot' &&
       github.event.client_payload.environment == 'production' &&
       github.event.client_payload.project.id == 'prj_N0tyAlXJcQPz1zO15o2Hbno9RV86')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCTION_SMOKE_REVISION_LOG: ${{ github.workspace }}/production-smoke-revisions.jsonl
    steps:
      - name: Check out trusted validation code
        uses: actions/checkout@v4
        with:
          ref: main
          path: validation
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: validation/.nvmrc

      - name: Verify manual source run provenance
        if: github.event_name == 'workflow_dispatch'
        id: source
        run: node validation/scripts/e2e/validate-deployment.mjs source
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download previously validated production target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: production-smoke-target-${{ steps.source.outputs.attempt }}
          path: production-smoke-target
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate production deployment
        id: target
        run: node validation/scripts/e2e/validate-deployment.mjs
        env:
          PRODUCTION_VERCEL_PROJECT_ID: prj_N0tyAlXJcQPz1zO15o2Hbno9RV86
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.attempt }}

      - name: Save validated target for manual retries
        if: github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-target-${{ github.run_attempt }}
          path: validated-production-target/target.json
          retention-days: 7
          if-no-files-found: error

      - name: Verify public production revision before installation
        id: preflight
        run: node validation/scripts/e2e/smoke-release.mjs preflight
        env:
          PRODUCTION_SMOKE_SHA: ${{ steps.target.outputs.sha }}

      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: deployed
          persist-credentials: false

      - name: Install locked test dependencies
        working-directory: deployed
        run: npm ci

      - name: Install Chromium
        working-directory: deployed
        run: npx playwright install --with-deps chromium

      - name: Run production journeys
        id: journeys
        working-directory: deployed
        run: node ../validation/scripts/e2e/deployment.mjs
        env:
          PRODUCTION_SMOKE_URL: https://www.aiholdem.gg
          PRODUCTION_SMOKE_SHA: ${{ steps.target.outputs.sha }}

      - name: Prepare credential-free failure diagnostics
        if: always()
        run: python3 validation/scripts/e2e/smoke-diagnostics.py deployed/test-results/production-smoke smoke-diagnostics

      - name: Record release outcome
        if: always()
        env:
          PRODUCTION_SMOKE_SHA: ${{ steps.target.outputs.sha }}
          PRODUCTION_SMOKE_DEPLOYMENT_URL: ${{ steps.target.outputs.url }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SMOKE_OUTCOME: ${{ steps.journeys.outcome }}
        run: node validation/scripts/e2e/smoke-release.mjs report

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-failure
          path: smoke-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
