name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      TYPESAFE_API_KEY: ci-placeholder
      LLM_API_ENDPOINT: https://example.com/v1/chat/completions
      LLM_API_KEY: ci-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks and tests
        run: npm run check

      - name: Build production application
        run: npm run build

  integration:
    name: Local SQL and production browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_CLI_VERSION: "2.119.0"
      EXTERNAL_INFERENCE_ENABLED: "false"
      TYPESAFE_API_KEY: ""
      LLM_API_ENDPOINT: ""
      LLM_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Cache only registry images, never containers, volumes, or database state.
      # Migrations do not affect image versions and still run on every job.
      - name: Restore Supabase Docker image archive
        id: supabase-images
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/supabase-docker-images/images.tar
          key: supabase-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.SUPABASE_CLI_VERSION }}-${{ hashFiles('supabase/config.toml') }}

      - name: Load cached Supabase Docker images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: docker image load --input "$RUNNER_TEMP/supabase-docker-images/images.tar"

      - name: Install Chromium and system dependencies
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium

      - name: Start disposable Supabase and apply migrations
        timeout-minutes: 12
        run: node scripts/e2e/supabase.mjs

      - name: Export Supabase Docker images on cache miss
        id: export-supabase-images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        timeout-minutes: 3
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t images < <(docker image ls \
            --filter 'reference=public.ecr.aws/supabase/*' \
            --filter 'reference=ghcr.io/supabase/*' \
            --filter 'reference=supabase/*' \
            --format '{{.Repository}}:{{.Tag}}' | sort -u)
          if (( ${#images[@]} == 0 )); then
            echo "::warning::No Supabase registry images found to cache."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/supabase-docker-images"
          docker image save --output "$RUNNER_TEMP/supabase-docker-images/images.tar" "${images[@]}"

      # Save after healthy startup so a later test failure does not lose the cache.
      - name: Save Supabase Docker image archive
        if: steps.export-supabase-images.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/supabase-docker-images/images.tar
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}

      - name: Verify SQL game reads
        timeout-minutes: 3
        run: npm run test:sql:game-reads

      - name: Verify SQL bot context
        timeout-minutes: 3
        run: npm run test:sql:bot-context

      - name: Verify SQL seat mutations
        timeout-minutes: 3
        run: npm run test:sql:seats

      - name: Verify SQL bot claims
        timeout-minutes: 3
        run: npm run test:sql:bot-claims

      - name: Build and test the production application
        timeout-minutes: 18
        run: npm run test:e2e:smoke

      - name: Stop disposable Supabase
        if: always()
        timeout-minutes: 2
        run: node scripts/e2e/supabase.mjs stop

      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          path: |
            playwright-report/
            test-results/
            integration-logs/
          retention-days: 7
          if-no-files-found: ignore
